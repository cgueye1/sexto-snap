# Seddo — nginx derrière le proxy Dokploy (Traefik gère le HTTPS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression gzip (camera-kit.mjs : ~2 Mo → ~500 Ko) ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json
               image/svg+xml text/javascript;
    gzip_vary on;

    # ---- En-têtes de sécurité ----
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    # Caméra autorisée (nécessaire pour Camera Kit), micro/géoloc bloqués.
    add_header Permissions-Policy      "camera=(self), microphone=(), geolocation=()" always;

    # CORS : camera-kit.mjs doit être chargeable depuis la même origine en
    # import ES-module ; certains navigateurs vérifient quand même ce header.
    add_header Access-Control-Allow-Origin "*" always;

    # ---- Healthcheck pour Dokploy ----
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ---- index.html : JAMAIS mis en cache ----
    # Évite la "vieille version" sur les téléphones après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate"            always;
        add_header X-Content-Type-Options "nosniff"                     always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate"            always;
        add_header X-Content-Type-Options "nosniff"                     always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files /index.html =404;
    }

    # ---- privacy.html : cache court (peut être mis à jour) ----
    location = /privacy.html {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Le bundle Camera Kit : cache très long (contenu immuable) ----
    # Nommé camera-kit.mjs, il ne change qu'avec un rebuild complet.
    location ~* \.(mjs|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"                    always;
        # Type MIME explicite pour les fichiers .mjs (certains nginx ne le connaissent pas)
        types { application/javascript mjs js; }
    }

    # ---- Reste des fichiers statiques ----
    location / {
        try_files $uri $uri/ =404;
    }
}
